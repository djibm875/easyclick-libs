<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - iEasyClick</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Additional styles for device list */
        .device-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .device-table th, .device-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .device-table th {
            background-color: #f0f0f0;
        }
        .actions-column button {
            margin-right: 5px;
            padding: 5px 8px;
            font-size: 0.9em;
            width: auto; /* Override full width for action buttons */
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
         .page-header h2 {
            margin: 0;
        }
        .add-device-btn {
            background-color: #28a745; /* Green */
        }
        .add-device-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="devices.html">Devices</a></li>
            <li><a href="tasks.html">Tasks</a></li>
            <li><a href="#" id="logoutButton">Logout</a></li>
        </ul>
    </nav>

    <div class="container main-content">
        <div class="page-header">
            <h2>Device List</h2>
            <button id="showRegisterDeviceForm" class="add-device-btn">Register New Device</button>
        </div>

        <!-- Placeholder for Register Device Form (initially hidden) -->
        <div id="registerDeviceModal" style="display:none; margin-bottom:20px; padding:15px; border:1px solid #ccc; border-radius:5px; background-color:#f9f9f9;">
            <h3>Register Device</h3>
            <form id="registerDeviceForm">
                <div class="form-group">
                    <label for="regDeviceId">Device ID (Unique):</label>
                    <input type="text" id="regDeviceId" required>
                </div>
                <div class="form-group">
                    <label for="regDeviceName">Device Name (Optional):</label>
                    <input type="text" id="regDeviceName">
                </div>
                <div class="form-group">
                    <label for="regPlatform">Platform (Android, iOS, etc.):</label>
                    <input type="text" id="regPlatform" required>
                </div>
                 <div class="form-group">
                    <label for="regOsVersion">OS Version:</label>
                    <input type="text" id="regOsVersion">
                </div>
                <button type="submit">Register Device</button>
                <button type="button" id="cancelRegisterDevice" style="background-color:#6c757d; margin-top:5px;">Cancel</button>
                <div id="registerDeviceMessage" style="margin-top:10px;"></div>
            </form>
        </div>

        <div id="deviceListContainer">
            <p>Loading devices...</p>
            <table class="device-table" id="devicesTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Device ID (External)</th>
                        <th>Platform</th>
                        <th>OS Version</th>
                        <th>Status</th>
                        <th>Last Seen</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="devicesTableBody">
                    <!-- Device rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
         <div id="errorMessage" class="error-message" style="display:none;"></div>
    </div>

    <script src="../js/devices.js"></script>
    <script>
        // Minimal inline script for logout, assuming it might be on multiple pages
        // More complex shared JS would go into a separate file.
        document.addEventListener("DOMContentLoaded", function() {
            const logoutButton = document.getElementById("logoutButton");
            if(logoutButton) {
                logoutButton.addEventListener("click", async function(e) {
                    e.preventDefault();
                    try {
                        const response = await fetch("/auth/logout", { method: "POST" });
                        if(response.ok) {
                            localStorage.removeItem("currentUser");
                            window.location.href = "login.html";
                        } else {
                            const data = await response.json();
                            alert("Logout failed: " + (data.error || "Unknown error"));
                        }
                    } catch (error) {
                        console.error("Logout error:", error);
                        alert("Error during logout.");
                    }
                });
            }
        });
    </script>
</body>
</html>
